[package]
name = "bake-benchmark"
version = "0.2.0"
edition = "2024"
rust-version = "1.88"
license = "MIT"
description = "Thin Bake integration for the shared Base benchmark tooling"
repository = "https://github.com/base-rs/bake-benchmark"
readme = "readme.md"
include = ["src/**", "context/**", "Cargo.toml", "readme.md", "license.md", "releases.md"]

[workspace]
members = ["bake"]
resolver = "3"

[workspace.metadata.bake.release]
reviewers = ["base-rs/maintainers"]

[dependencies]
# Tasks register through Bake's linkme slice, so they are visible only to the same semver-compatible Bake; release a new version for each Bake minor version.
bake = "0.20.1"
base-benchmark = { version = "0.2.0", default-features = false, features = ["runner"] }

[dev-dependencies]
serde_json = "1.0.154"
tempfile = "3.27.0"
